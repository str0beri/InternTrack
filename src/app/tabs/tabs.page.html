
<ion-tabs>

  <ion-tab-bar
    slot="bottom"
    class="custom-tab-bar">

    <!-- HOME -->

    <ion-tab-button
      tab="home"
      href="/tabs/home"
      aria-label="Home">

      <ion-icon
        class="icon-outline"
        name="home-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-icon
        class="icon-filled"
        name="home"
        aria-hidden="true">
      </ion-icon>

      <ion-label>Home</ion-label>

    </ion-tab-button>


    <!-- ATTENDANCE -->

    <ion-tab-button
      tab="attendance"
      href="/tabs/attendance"
      aria-label="Attendance">

      <ion-icon
        class="icon-outline"
        name="time-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-icon
        class="icon-filled"
        name="time"
        aria-hidden="true">
      </ion-icon>

      <ion-label>Attendance</ion-label>

    </ion-tab-button>


    <!-- MY DTR -->

    <ion-tab-button
      tab="dtr"
      href="/tabs/dtr"
      aria-label="My Daily Time Record">

      <ion-icon
        class="icon-outline"
        name="calendar-clear-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-icon
        class="icon-filled"
        name="calendar-clear"
        aria-hidden="true">
      </ion-icon>

      <ion-label>My DTR</ion-label>

    </ion-tab-button>


    <!-- REPORTS -->

    <ion-tab-button
      tab="reports"
      href="/tabs/reports"
      aria-label="Reports">

      <ion-icon
        class="icon-outline"
        name="folder-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-icon
        class="icon-filled"
        name="folder"
        aria-hidden="true">
      </ion-icon>

      <ion-label>Reports</ion-label>

    </ion-tab-button>


    <!-- PROFILE -->

    <ion-tab-button
      tab="profile"
      href="/tabs/profile"
      aria-label="Profile">

      <ion-icon
        class="icon-outline"
        name="person-outline"
        aria-hidden="true">
      </ion-icon>

      <ion-icon
        class="icon-filled"
        name="person"
        aria-hidden="true">
      </ion-icon>

      <ion-label>Profile</ion-label>

    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
